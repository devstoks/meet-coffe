# MeetCoffe — Nginx (exemplo pronto para a futura VPS)
# Copiar para /etc/nginx/sites-available/meetcoffe.conf e ativar com link em sites-enabled.
# Ajuste: server_name, APP_ROOT e as portas. TLS (certbot/Cloudflare) fica fora deste arquivo.
#
# Layout esperado:
#   /srv/meetcoffe/client/dist   -> build do React (npm run build)
#   /srv/meetcoffe/uploads       -> fotos/vídeos (a API grava aqui; o Nginx serve direto)
#   API Node em 127.0.0.1:3333

# ---- fora do bloco server (vai em http {} via conf.d) ----------------------
# Cache de arquivos abertos: evita syscalls repetidas em fotos/vídeos populares.
open_file_cache          max=2000 inactive=60s;
open_file_cache_valid    120s;
open_file_cache_min_uses 2;
open_file_cache_errors   on;

upstream meetcoffe_api {
    server 127.0.0.1:3333;
    keepalive 16;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name meetcoffe.example.com;   # TROCAR

    root /srv/meetcoffe/client/dist;
    index index.html;

    # Envio de arquivos pelo kernel (sem passar pela memória do Nginx) -> pouca CPU/RAM
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    sendfile_max_chunk 1m;       # não deixa um vídeo monopolizar o worker
    keepalive_timeout  30s;

    # Upload de vídeo de produto (limite da API: 30 MB)
    client_max_body_size 35m;

    # Compressão só para texto; foto/vídeo já são comprimidos
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_vary on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ---------------- Uploads: fotos e vídeos (servidos direto do disco) ------
    # Nomes de arquivo são únicos (timestamp + random), então o cache pode ser imutável.
    location /uploads/ {
        alias /srv/meetcoffe/uploads/;
        types { model/gltf-binary glb; }   # modelos 3D (feature AR); se o Nginx avisar 'duplicate extension', pode remover esta linha
        access_log off;
        add_header Cache-Control "public, max-age=2592000, immutable" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;

        # Vídeo: Range requests (seek/stream parcial) já funcionam em arquivos estáticos.
        # O módulo mp4 permite pular para o meio do vídeo (?start=) e entrega o
        # início rápido se o arquivo tiver o 'moov atom' no começo (ver README).
        location ~* \.mp4$ {
            mp4;
            mp4_buffer_size     1m;
            mp4_max_buffer_size 5m;
            limit_rate_after 3m;   # os primeiros 3 MB saem na velocidade máxima (play instantâneo)
            limit_rate       2m;   # depois ~2 MB/s por conexão: protege a banda da VPS
            add_header Cache-Control "public, max-age=2592000, immutable" always;
            add_header Cross-Origin-Resource-Policy "cross-origin" always;
        }
    }

    # ---------------- API ----------------------------------------------------
    location /api/ {
        proxy_pass http://meetcoffe_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        # dados dinâmicos (pedidos, mesas): nunca cachear
        add_header Cache-Control "no-store" always;
    }

    # ---------------- Socket.IO (pedidos em tempo real) ----------------------
    location /socket.io/ {
        proxy_pass http://meetcoffe_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host       $host;
        proxy_set_header X-Real-IP  $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_buffering off;
    }

    # ---------------- Front-end (build do Vite) ------------------------------
    # Assets têm hash no nome -> cache longo
    location /assets/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # SPA: qualquer rota cai no index.html (sem cache para pegar versões novas)
    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
